<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Stock Screen</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #131722; overflow: hidden; font-family: system-ui, sans-serif; }
  .ticker { height: 76px; }
  .ticker .tradingview-widget-container { height: 100%; }
  .layout { display: flex; height: calc(100vh - 76px); }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chart { flex: 1; min-height: 0; overflow: hidden; }
  .chart .tradingview-widget-container { height: 100%; }
  .sidebar { width: 380px; flex-shrink: 0; overflow: hidden; display: flex; flex-direction: column; }
  .replica { flex: 1; min-height: 0; overflow: hidden; cursor: pointer; padding: 0; background: #131722; display: flex; flex-direction: column; }
  .replica-chart { flex: 1; min-height: 0; overflow: hidden; }
  .replica-chart .tradingview-widget-container { height: 100%; }
</style>
</head>
<body>
  <!-- First version: scrolling ticker tape -->
  <div class="ticker">
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
      {
        "symbols": [
          { "description": "S&P 500", "proName": "FOREXCOM:SPXUSD" },
          { "description": "Nasdaq 100", "proName": "FOREXCOM:NSXUSD" },
          { "description": "Apple", "proName": "NASDAQ:AAPL" },
          { "description": "Nvidia", "proName": "NASDAQ:NVDA" },
          { "description": "Microsoft", "proName": "NASDAQ:MSFT" },
          { "description": "Meta", "proName": "NASDAQ:META" },
          { "description": "Tesla", "proName": "NASDAQ:TSLA" },
          { "description": "AMD", "proName": "NASDAQ:AMD" },
          { "description": "Netflix", "proName": "NASDAQ:NFLX" },
          { "description": "Bitcoin", "proName": "BITSTAMP:BTCUSD" },
          { "description": "Ethereum", "proName": "BITSTAMP:ETHUSD" }
        ],
        "showSymbolLogo": true,
        "colorTheme": "dark",
        "isTransparent": false,
        "displayMode": "adaptive",
        "locale": "en"
      }
      </script>
    </div>
  </div>

  <div class="layout">
    <div class="main">
      <div class="chart" id="chartBox"></div>
    </div>

    <!-- 5 replicas of the large chart, on the side -->
    <aside class="sidebar" id="sidebar"></aside>
  </div>

<script>
  // 6 symbols in total: 1 on the large screen + 5 in the sidebar.
  // Rotation is an exchange, not a duplicate: every 10 minutes the large
  // chart swaps places with the next sidebar panel, so the large symbol
  // is never also shown in the sidebar.
  const ALL = [
    { name: "S&P 500", symbol: "FOREXCOM:SPXUSD" },
    { name: "Bitcoin", symbol: "BITSTAMP:BTCUSD" },
    { name: "Nvidia", symbol: "NASDAQ:NVDA" },
    { name: "Apple", symbol: "NASDAQ:AAPL" },
    { name: "Microsoft", symbol: "NASDAQ:MSFT" },
    { name: "Alphabet", symbol: "NASDAQ:GOOGL" }
  ];
  let large = ALL[0];
  let sidebarSymbols = ALL.slice(1);
  let swapPos = 0;
  const ROTATE_MS = 600000; // 10 minutes, symbol exchange
  let symbolTimer = null;

  // Shared settings: one interval controls the large chart AND all
  // small panels. It rotates 1m -> 1h -> 1D every 5 minutes, and every
  // chart is reloaded with that same interval, so they always match.
  // TradingView interval codes: "1" = 1 minute, "60" = 1 hour, "D" = 1 day.
  const INTERVALS = ["1", "60", "D"];
  let intervalIndex = 0;
  let currentInterval = INTERVALS[intervalIndex];
  const INTERVAL_MS = 300000; // 5 minutes
  let intervalTimer = null;

  const sidebar = document.getElementById("sidebar");
  const chartBox = document.getElementById("chartBox");

  // Shared base settings for every chart, large and small:
  // interval = currentInterval (rotates 1m / 1h / 1D), theme dark,
  // style 1 (candles), timezone Etc/UTC, locale en.
  function loadChartInto(box, symbol, opts) {
    opts = Object.assign({}, opts || {});
    box.innerHTML = "";
    const container = document.createElement("div");
    container.className = "tradingview-widget-container";
    container.style.height = "100%";
    const widget = document.createElement("div");
    widget.className = "tradingview-widget-container__widget";
    widget.style.height = "100%";
    widget.style.width = "100%";
    container.appendChild(widget);
    const script = document.createElement("script");
    script.type = "text/javascript";
    script.src = "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";
    script.async = true;
    script.textContent = JSON.stringify(Object.assign({
      autosize: true, symbol: symbol, interval: currentInterval, timezone: "Etc/UTC",
      theme: "dark", style: "1", locale: "en",
      support_host: "https://www.tradingview.com"
    }, opts));
    container.appendChild(script);
    box.appendChild(container);
  }

  // Small panels: they share the large chart's base settings (interval,
  // theme, style, timezone) — only their display-only settings differ.
  // No controls, no volume, no date-range bar. The name banner is the
  // internal TradingView legend, like on the large screen: it overlays
  // the chart, so it takes no extra space outside it. Its size cannot
  // be changed inside the embed iframe, so it stays at default size.
  // Dates and logo are kept as TradingView renders them — covering
  // them left a blank bar, so no covers/crops are used here.
  const replicaOpts = {
    allow_symbol_change: false,
    hide_top_toolbar: true,
    hide_side_toolbar: true,
    hide_legend: false,
    hide_volume: true,
    withdateranges: false,
    details: false,
    hotlist: false,
    calendar: false,
    save_image: false
  };

  // Build the 5 sidebar panels once; only a panel that swaps changes.
  const panels = sidebarSymbols.map((item, i) => {
    const el = document.createElement("div");
    el.className = "replica";
    el.title = item.name;
    el.addEventListener("click", () => swap(i));
    const chartEl = document.createElement("div");
    chartEl.className = "replica-chart";
    el.appendChild(chartEl);
    sidebar.appendChild(el);
    loadChartInto(chartEl, item.symbol, replicaOpts);
    return { el: el, chartEl: chartEl };
  });

  function renderLarge() {
    loadChartInto(chartBox, large.symbol, { allow_symbol_change: true });
  }

  function renderAllSmall() {
    panels.forEach((p, i) => {
      loadChartInto(p.chartEl, sidebarSymbols[i].symbol, replicaOpts);
    });
  }

  function swap(i) {
    const oldLarge = large;
    large = sidebarSymbols[i];
    sidebarSymbols[i] = oldLarge;
    panels[i].el.title = sidebarSymbols[i].name;
    loadChartInto(panels[i].chartEl, sidebarSymbols[i].symbol, replicaOpts);
    renderLarge();
    swapPos = (i + 1) % sidebarSymbols.length;
    // Symbol timer only — the interval timer runs independently.
    clearTimeout(symbolTimer);
    symbolTimer = setTimeout(() => swap(swapPos), ROTATE_MS);
  }

  function rotateInterval() {
    intervalIndex = (intervalIndex + 1) % INTERVALS.length;
    currentInterval = INTERVALS[intervalIndex];
    // Same new interval on the large chart and on every small panel.
    renderLarge();
    renderAllSmall();
    clearTimeout(intervalTimer);
    intervalTimer = setTimeout(rotateInterval, INTERVAL_MS);
  }

  renderLarge();
  symbolTimer = setTimeout(() => swap(swapPos), ROTATE_MS);
  intervalTimer = setTimeout(rotateInterval, INTERVAL_MS);
</script>
</body>
</html>
